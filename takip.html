        window.toggleDarkMode = () => { localStorage.setItem('family_theme', document.documentElement.classList.contains('dark') ? 'light' : 'dark'); applyDarkMode(); };
        applyDarkMode();

        function updateClock() {
            const now = new Date();
            const topDate = document.getElementById('topDate');
            const topTime = document.getElementById('topTime');
            if(topDate) topDate.innerText = now.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', weekday: 'long' });
            if(topTime) topTime.innerText = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        }

        async function startApp() {
            if (currentProfile) { showMainApp(); }
            render(); 
            try {
                await signInAnonymously(auth);
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'family_tracker_main', 'current_week');
                onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) {
                        state = { ...state, ...snapshot.data() };
                        localStorage.setItem(STORAGE_MASTER, JSON.stringify(state));
                        render();
                    }
                    const dot = document.getElementById('syncDot');
                    const text = document.getElementById('syncText');
                    if(dot) dot.className = 'w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]';
                    if(text) text.innerText = 'Bulut Aktif ?';
                });
            } catch (err) { console.error(err); }
        }

        window.loginAs = (name) => { currentProfile = name; localStorage.setItem(STORAGE_AUTH, name); showMainApp(); render(); };
        
        // HATA DÜZELTÝLDÝ 2: "Profili Deðiþtir" diyince sayfa yenilenme hatasý tamamen kaldýrýldý. Saniyesinde döner!
        window.logout = () => { 
            currentProfile = null; 
            localStorage.removeItem(STORAGE_AUTH); 
            document.getElementById('loginScreen').style.display = 'flex'; 
            document.getElementById('mainApp').style.display = 'none'; 
        };
        
        function showMainApp() { document.getElementById('loginScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'block'; }

        window.saveCommonMsg = () => {
            const txt = document.getElementById('commonMessage').value;
            state['family_common_msg_main'] = { text: txt, author: currentProfile };
            localStorage.setItem(STORAGE_MASTER, JSON.stringify(state));
            render();
        };

        window.addShopItem = () => {
            const input = document.getElementById('newShopItem');
            const item = input.value.trim();
            if (item) {
                if (!state.shopping_list) state.shopping_list = [];
                state.shopping_list.push({ id: Date.now(), text: item, author: currentProfile });
                input.value = '';
                localStorage.setItem(STORAGE_MASTER, JSON.stringify(state));
                render();
            }
        };

        window.removeShopItem = (id) => {
            state.shopping_list = state.shopping_list.filter(i => i.id !== id);
            localStorage.setItem(STORAGE_MASTER, JSON.stringify(state));
            render();
        };

        window.updateWater = (val) => {
            const key = `${selectedMember}_${dayKeys[activeIdx]}_water`;
            state[key] = Math.max(0, Math.min(12, (state[key] || 0) + val));
            localStorage.setItem(STORAGE_MASTER, JSON.stringify(state));
            render();
        };

        window.selectMember = (name) => { selectedMember = name; render(); };
        
        // HATA DÜZELTÝLDÝ 1: Günler arasýnda gezme komutu geri eklendi!
        window.selectDay = (idx) => { activeIdx = idx; render(); };
        
        window.toggleItem = (supId) => { const key = `${selectedMember}_${dayKeys[activeIdx]}_${supId}`; state[key] = !state[key]; render(); };
        window.toggleHabit = (hId) => { const key = `Mehmet_${dayKeys[activeIdx]}_habit_${hId}`; state[key] = !state[key]; render(); };

        window.render = () => {
            if (!currentProfile) return;
            const dayKey = dayKeys[activeIdx];
            const config = state.supplement_configs || DEFAULT_CONFIG;
            const sups = config[selectedMember] || [];
            
            document.querySelectorAll('.member-btn').forEach(b => b.classList.toggle('active', b.id === `m-${selectedMember}`));
            document.querySelectorAll('.day-btn').forEach((b, i) => b.classList.toggle('active', i === activeIdx));
            document.getElementById('dayTitle').innerText = dayNames[activeIdx];

            const msgObj = state['family_common_msg_main'] || { text: "", author: "" };
            document.getElementById('commonMessage').value = msgObj.text || "";
            document.getElementById('messageAuthor').innerText = msgObj.text ? `Yazan: ${msgObj.author}` : "";

            const shopContainer = document.getElementById('shopList');
            shopContainer.innerHTML = '';
            (state.shopping_list || []).forEach(item => {
                shopContainer.innerHTML += `<div onclick="removeShopItem(${item.id})" class="bg-white/90 dark:bg-slate-800 text-teal-800 dark:text-teal-200 text-xs md:text-sm font-bold px-4 py-2 rounded-xl border border-teal-100 dark:border-slate-600 cursor-pointer shadow-sm hover:bg-red-500 hover:text-white dark:hover:bg-red-600 transition-colors">${item.text} ?</div>`;
            });

            const list = document.getElementById('itemList');
            list.innerHTML = '';
            sups.forEach(sup => {
                const checked = state[`${selectedMember}_${dayKey}_${sup.id}`] || false;
                list.innerHTML += `<div onclick="toggleItem('${sup.id}')" class="check-card p-4 md:p-5 rounded-2xl md:rounded-3xl flex items-center justify-between border-2 ${checked ? 'bg-green-50 border-green-200 dark:bg-green-900/20 dark:border-green-800' : 'bg-white border-slate-50 dark:bg-slate-700 dark:border-slate-600'}"> <div class="flex flex-col"><span class="font-bold text-sm md:text-base ${checked ? 'strikethrough' : 'dark:text-white'}">${sup.name}</span><span class="time-tag tag-${sup.time.toLowerCase()}">${sup.time}</span></div> <div class="custom-check shadow-sm w-8 h-8 md:w-10 md:h-10 rounded-xl" style="background:${checked?'#10b981':'transparent'}; border-color:${checked?'#10b981':'#e2e8f0'}"><span class="text-white md:text-xl font-bold">${checked?'?':''}</span></div></div>`;
            });

            const waterVal = state[`${selectedMember}_${dayKey}_water`] || 0;
            document.getElementById('waterValue').innerText = `${waterVal} / 8`;
            const icons = document.getElementById('waterIcons');
            icons.innerHTML = '';
            for(let i=1; i<=8; i++) { const icon = document.createElement('span'); icon.innerText = i <= waterVal ? '??' : '?'; icons.appendChild(icon); }

            const mehmetDiv = document.getElementById('mehmetHabits');
            if (selectedMember === 'Mehmet') {
                mehmetDiv.classList.remove('hidden');
                mehmetDiv.innerHTML = '<p class="text-[10px] md:text-xs font-bold text-indigo-500 uppercase mb-4 tracking-widest">?? Mehmet Özel Hedefler</p>';
                [{id:'sugar',n:'Þekersiz Gün',i:'??'},{id:'walk',n:'Yürüyüþ',i:'??'},{id:'dumb',n:'Dambýl',i:'????>?'}].forEach(h => {
                    const ch = state[`Mehmet_${dayKey}_habit_${h.id}`];
                    mehmetDiv.innerHTML += `<div onclick="toggleHabit('${h.id}')" class="p-4 mb-3 rounded-2xl border-2 flex justify-between items-center cursor-pointer transition-all ${ch?'bg-indigo-500 border-indigo-500 text-white shadow-md':'bg-white dark:bg-slate-700 dark:border-slate-600 dark:text-white'}"><span class="text-sm md:text-base font-bold">${h.i} ${h.n}</span><span class="text-lg">${ch?'?':'?'}</span></div>`;
                });
            } else { mehmetDiv.classList.add('hidden'); }
        };

        window.saveToCloud = async () => {
            const btn = document.getElementById('saveBtn');
            btn.innerText = 'KAYDEDÝLÝYOR...';
            try {
                // 1. Ana dosya (Gündelik Kullanýlan)
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'family_tracker_main', 'current_week');
                await setDoc(docRef, state);
                
                // HATA DÜZELTÝLDÝ 3: Yýllar sonra bile kayýplara uðramamasý için otomatik KALICI ARÞÝV sistemi (Örn: 2026_Hafta_18)
                const d = new Date();
                const weekNum = Math.ceil((((d - new Date(d.getFullYear(), 0, 1)) / 86400000) + new Date(d.getFullYear(), 0, 1).getDay() + 1) / 7);
                const archiveKey = d.getFullYear() + "_Hafta_" + weekNum;
                const archiveRef = doc(db, 'artifacts', appId, 'public', 'data', 'family_tracker_archive', archiveKey);
                await setDoc(archiveRef, state);

                btn.innerText = 'BAÞARIYLA KAYDEDÝLDÝ ?';
                setTimeout(() => btn.innerText = 'BULUTA KAYDET', 2000);
            } catch (e) { 
                btn.innerText = 'HATA OLUÞTU!'; 
                setTimeout(() => btn.innerText = 'BULUTA KAYDET', 2000);
            }
        };

        window.openSettings = () => { renderSettingsList(); document.getElementById('settingsModal').classList.add('modal-active'); };
        window.closeSettings = () => document.getElementById('settingsModal').classList.remove('modal-active');
        window.openHealth = () => { renderHealthHistory(); document.getElementById('healthModal').classList.add('modal-active'); };
        window.closeHealth = () => document.getElementById('healthModal').classList.remove('modal-active');
        window.openReport = () => { renderReport(); document.getElementById('reportModal').classList.add('modal-active'); };
        window.closeReport = () => document.getElementById('reportModal').classList.remove('modal-active');
        window.openModal = () => document.getElementById('customModal').classList.add('modal-active');
        window.closeModal = () => document.getElementById('customModal').classList.remove('modal-active');
        window.executeReset = async () => { closeModal(); state = {}; localStorage.setItem(STORAGE_MASTER, JSON.stringify(state)); render(); await window.saveToCloud(); };

        function renderSettingsList() { 
            const list = document.getElementById('currentSupList');
            const config = state.supplement_configs || DEFAULT_CONFIG;
            const mySups = config[selectedMember] || [];
            list.innerHTML = mySups.length ? '' : '<p class="text-center text-xs text-slate-400">Henüz takviye yok.</p>';
            mySups.forEach((sup, idx) => {
                list.innerHTML += `<div class="flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-700 rounded-2xl transition-colors"> <div> <p class="text-sm font-bold text-slate-700 dark:text-slate-200">${sup.name}</p> <p class="text-[10px] text-slate-400 font-bold uppercase">${sup.time}</p> </div> <button onclick="removeSupplement(${idx})" class="text-red-400 text-xs font-bold outline-none">SÝL</button> </div>`;
            });
        }

        function renderHealthHistory() { 
            const hist = document.getElementById('healthHistory'); 
            const logs = state.health_logs || []; 
            const myLogs = logs.filter(l => l.member === selectedMember).reverse(); 
            hist.innerHTML = myLogs.length ? '' : '<p class="text-center text-xs text-slate-400">Henüz kayýt yok.</p>'; 
            myLogs.slice(0, 10).forEach(log => { 
                hist.innerHTML += `<div class="p-3 bg-slate-50 dark:bg-slate-700 rounded-2xl border-l-4 border-red-400 transition-colors"> <div class="flex justify-between text-[9px] font-bold text-slate-400 mb-1"> <span>${log.date}</span> <span>${log.time}</span> </div> <p class="text-sm font-bold text-slate-700 dark:text-slate-200">${log.fever ? '??? ' + log.fever + '°C' : ''}</p> <p class="text-xs text-slate-500 dark:text-slate-400">${log.note}</p> </div>`; 
            }); 
        }

        function renderReport() { 
            const content = document.getElementById('reportContent'); 
            content.innerHTML = ''; 
            const config = state.supplement_configs || DEFAULT_CONFIG; 
            Object.keys(DEFAULT_CONFIG).forEach(member => { 
                let totalTasks = 0, doneTasks = 0, totalWater = 0; 
                dayKeys.forEach(day => { 
                    (config[member] || []).forEach(sup => { totalTasks++; if (state[`${member}_${day}_${sup.id}`]) doneTasks++; }); 
                    totalWater += (state[`${member}_${day}_water`] || 0); 
                }); 
                const perc = Math.round((doneTasks / (totalTasks || 1)) * 100); 
                content.innerHTML += `<div class="p-4 bg-slate-50 dark:bg-slate-700 rounded-3xl transition-colors mb-3"> <div class="flex justify-between items-center mb-2"> <span class="font-black text-slate-800 dark:text-white">${member}</span> <span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">%${perc} BAÞARI</span> </div> <div class="w-full bg-slate-200 dark:bg-slate-600 h-2 rounded-full overflow-hidden mb-2"> <div class="bg-blue-500 h-full" style="width: ${perc}%"></div> </div> <p class="text-[10px] font-bold text-slate-400 dark:text-slate-300">?? Su Ortalamasý: ${Math.round(totalWater/7)} Bardak</p> </div>`; 
            }); 
        }

        window.addNewSupplement = () => { const name = document.getElementById('newSupName').value.trim(); const time = document.getElementById('newSupTime').value; if (!name) return; if (!state.supplement_configs) state.supplement_configs = JSON.parse(JSON.stringify(DEFAULT_CONFIG)); state.supplement_configs[selectedMember].push({ id: Date.now().toString(), name, time }); document.getElementById('newSupName').value = ''; localStorage.setItem(STORAGE_MASTER, JSON.stringify(state)); renderSettingsList(); render(); };
        window.removeSupplement = (idx) => { if (!state.supplement_configs) state.supplement_configs = JSON.parse(JSON.stringify(DEFAULT_CONFIG)); state.supplement_configs[selectedMember].splice(idx, 1); localStorage.setItem(STORAGE_MASTER, JSON.stringify(state)); renderSettingsList(); render(); };
        window.addHealthLog = () => { const fever = document.getElementById('healthFever').value; const note = document.getElementById('healthNote').value.trim(); if (!fever && !note) return; if (!state.health_logs) state.health_logs = []; state.health_logs.push({ member: selectedMember, fever, note, date: new Date().toLocaleDateString('tr-TR'), time: new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}) }); document.getElementById('healthFever').value = ''; document.getElementById('healthNote').value = ''; localStorage.setItem(STORAGE_MASTER, JSON.stringify(state)); renderHealthHistory(); };

        setInterval(updateClock, 1000); updateClock(); startApp();
    </script>
</body>
</html>
